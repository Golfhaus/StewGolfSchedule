<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Together Calendar Prototype</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f8f9fd}*{box-sizing:border-box}body{margin:0}.app{max-width:720px;margin:auto;padding:24px 18px 110px}.top{display:flex;justify-content:space-between;align-items:flex-start}.eyebrow{color:#ec4899;font-weight:800;letter-spacing:.16em;text-transform:uppercase;font-size:.75rem}h1{margin:.2rem 0;color:#172554}.switch,.nav button,.pill,.primary,.danger,.fab{font:inherit}.switch{border:0;border-radius:999px;background:white;padding:10px 14px;color:#172554;font-weight:700}.banner{margin-top:16px;padding:16px;border-radius:18px;background:#eefbf2;color:#166534}.banner.bad{background:#fff0f2;color:#991b1b;border-left:6px solid #ef4444}.day{margin-top:24px}.day h2{font-size:.85rem;color:#64748b;text-transform:uppercase;letter-spacing:.08em}.event{background:#fff;border-radius:18px;padding:15px;margin:10px 0;border-left:6px solid #1e3a8a;box-shadow:0 5px 20px #1725540d}.event.ryan{border-left-color:#ec4899}.event.both{border-left-color:#7c3aed}.meta{color:#64748b;margin-top:4px;font-size:.9rem}.card{background:white;border-radius:22px;padding:20px;box-shadow:0 6px 24px #1725540d;margin-top:18px}label{display:flex;flex-direction:column;gap:6px;margin:14px 0;font-weight:700;color:#172554}input,select{font:inherit;padding:12px;border:1px solid #cbd5e1;border-radius:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.check{flex-direction:row;align-items:center;color:#334155}.pills{display:flex;gap:10px}.pill{border:1px solid #cbd5e1;background:white;border-radius:999px;padding:9px 15px;font-weight:700}.pill.active{background:#172554;color:white}.primary,.danger{width:100%;border:0;border-radius:14px;padding:14px;font-weight:800}.primary{background:#172554;color:white}.danger{background:#b91c1c;color:white}.note{border-radius:14px;padding:13px;margin:12px 0}.note.ok{background:#eefbf2;color:#166534}.note.info{background:#fffbeb;color:#92400e}.note.bad{background:#fff0f2;color:#991b1b}.nav{position:fixed;left:0;right:0;bottom:0;background:#172554;display:flex;justify-content:center;gap:20px;padding:12px}.nav button{border:0;background:transparent;color:#b9c4e1}.nav button.active{color:white;font-weight:800}.fab{position:fixed;right:max(22px,calc((100vw - 720px)/2 + 22px));bottom:64px;width:58px;height:58px;border:0;border-radius:50%;background:#ec4899;color:#fff;font-size:28px}.hidden{display:none}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div><div class="eyebrow">Together</div><h1 id="title">Hi, Eric!</h1></div><button class="switch" id="switchUser">Eric</button></div>
  <main id="content"></main>
</div>
<button class="fab" id="addBtn">+</button>
<nav class="nav"><button data-view="agenda" class="active">Agenda</button><button data-view="calendar">Calendar</button><button data-view="conflicts">Conflicts</button></nav>
<script>
const initial=[
{id:'1',title:'Trivia',date:'2026-09-01',start:'19:00',end:'21:00',allDay:false,blocks:false,participants:['eric','ryan'],location:'Flatbreads'},
{id:'2',title:'Ryan — Show',date:'2026-09-01',start:'18:00',end:'20:00',allDay:false,blocks:false,participants:['ryan'],location:'Fair Winds'}
];
let events=JSON.parse(localStorage.getItem('together-prototype-events')||'null')||initial;
let actor=localStorage.getItem('together-prototype-user')||'eric';
let view='agenda'; let draft=null; let checked=false; let override=false;
const $=s=>document.querySelector(s); const content=$('#content');
function save(){localStorage.setItem('together-prototype-events',JSON.stringify(events))}
function mins(t){let [h,m]=t.split(':').map(Number);return h*60+m}
function overlap(a,b){if(a.date!==b.date)return false;if(a.allDay&&!a.blocks)return false;if(b.allDay&&!b.blocks)return false;if(a.allDay||b.allDay)return true;return mins(a.start)<mins(b.end)&&mins(a.end)>mins(b.start)}
function conflicts(){let out=[];for(let i=0;i<events.length;i++)for(let j=i+1;j<events.length;j++)if(overlap(events[i],events[j]))for(const p of ['eric','ryan'])if(events[i].participants.includes(p)&&events[j].participants.includes(p))out.push({a:events[i],b:events[j],p});return out.filter(c=>c.a.date>=new Date().toISOString().slice(0,10))}
function fmt(t){if(!t)return'';let [h,m]=t.split(':').map(Number);return new Intl.DateTimeFormat('en-US',{hour:'numeric',minute:'2-digit'}).format(new Date(2026,0,1,h,m))}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('#title').textContent=view==='agenda'?`Hi, ${actor==='eric'?'Eric':'Ryan'}!`:view==='add'?'Add something':view[0].toUpperCase()+view.slice(1);$('#switchUser').textContent=actor==='eric'?'Eric':'Ryan';if(view==='agenda')renderAgenda();if(view==='add')renderAdd();if(view==='conflicts')renderConflicts();if(view==='calendar')content.innerHTML='<section class="card"><h2>Week & month views</h2><p>This prototype focuses first on the agenda and conflict engine.</p></section>'}
function renderAgenda(){const cs=conflicts();let html=cs.length?`<button class="banner bad" onclick="view='conflicts';render()"><strong>⚠ ${cs.length} conflict${cs.length>1?'s':''} need attention</strong><br>Review conflicts →</button>`:`<div class="banner">✓ No unresolved conflicts</div>`;const grouped={};[...events].sort((a,b)=>(a.date+(a.start||'')).localeCompare(b.date+(b.start||''))).forEach(e=>(grouped[e.date]??=[]).push(e));for(const [d,list] of Object.entries(grouped)){html+=`<section class="day"><h2>${new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}</h2>`;for(const e of list){const cls=e.participants.length===2?'both':e.participants[0];html+=`<div class="event ${cls}"><strong>${e.title}</strong><div>${e.allDay?'All day':fmt(e.start)+'–'+fmt(e.end)}</div>${e.location?`<div class="meta">${e.location}</div>`:''}<div class="meta">${e.participants.map(x=>x==='eric'?'Eric':'Ryan').join(' + ')}</div></div>`}html+='</section>'}content.innerHTML=html}
function newDraft(){return{id:crypto.randomUUID(),title:'',date:new Date().toISOString().slice(0,10),start:'18:00',end:'19:00',allDay:false,blocks:false,participants:[actor],location:'',repeat:'none'}}
function candidate(){const partner=actor==='eric'?'ryan':'eric',own=[],other=[];for(const e of events){if(!overlap(draft,e))continue;if(draft.participants.includes(actor)&&e.participants.includes(actor))own.push(e);if(draft.participants.includes(partner)&&e.participants.includes(partner))other.push(e)}return{own,other}}
function renderAdd(){if(!draft)draft=newDraft();const c=candidate();let html=`<section class="card"><p class="eyebrow">1 · When is it?</p><label>Date<input id="date" type="date" value="${draft.date}"></label><label class="check"><input id="allDay" type="checkbox" ${draft.allDay?'checked':''}> All-day event</label>`;if(!draft.allDay)html+=`<div class="row"><label>Start<input id="start" type="time" value="${draft.start}"></label><label>End<input id="end" type="time" value="${draft.end}"></label></div>`;else html+=`<label class="check"><input id="blocks" type="checkbox" ${draft.blocks?'checked':''}> Treat participant(s) as busy all day</label>`;html+=`<div class="pills"><button class="pill ${draft.participants.includes('eric')?'active':''}" data-person="eric">Eric</button><button class="pill ${draft.participants.includes('ryan')?'active':''}" data-person="ryan">Ryan</button></div><br><button class="primary" id="checkBtn">Check schedule</button>`;if(checked){if(c.own.length)html+=`<div class="note bad"><strong>You already have something then.</strong><br>${c.own.map(e=>e.title).join(', ')}</div>`;else html+='<div class="note ok">✓ No conflict on your schedule.</div>';if(c.other.length)html+=`<div class="note info"><strong>${actor==='eric'?'Ryan':'Eric'} is already booked:</strong> ${c.other.map(e=>e.title).join(', ')}</div>`;if(!c.own.length||override)html+=`<p class="eyebrow">2 · What is it?</p><label>Title<input id="eventTitle" value="${draft.title}" placeholder="Dinner, show, trivia…"></label><label>Location<input id="location" value="${draft.location||''}" placeholder="Optional"></label><label>Repeats<select id="repeat"><option value="none">Does not repeat</option><option value="daily">Daily</option><option value="weekly">Weekly</option><option value="biweekly">Every 2 weeks</option><option value="monthly">Monthly</option></select></label><button class="primary" id="saveBtn">Add event</button>`;else html+=`<div class="note bad"><p>This conflict will remain visible until the schedule is actually fixed.</p><button class="danger" id="overrideBtn">Add anyway — I'll resolve it later</button></div>`}html+='</section>';content.innerHTML=html;bindAdd()}
function bindAdd(){const bind=(id,ev,fn)=>{let x=$('#'+id);if(x)x.addEventListener(ev,fn)};bind('date','change',e=>{draft.date=e.target.value;checked=false;render()});bind('allDay','change',e=>{draft.allDay=e.target.checked;checked=false;render()});bind('start','change',e=>{draft.start=e.target.value;checked=false});bind('end','change',e=>{draft.end=e.target.value;checked=false});bind('blocks','change',e=>draft.blocks=e.target.checked);document.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>{let p=b.dataset.person;draft.participants=draft.participants.includes(p)?draft.participants.filter(x=>x!==p):[...draft.participants,p];render()});bind('checkBtn','click',()=>{checked=true;render()});bind('overrideBtn','click',()=>{override=true;render()});bind('saveBtn','click',()=>{draft.title=$('#eventTitle').value.trim();draft.location=$('#location').value;draft.repeat=$('#repeat').value;if(!draft.title)return;events.push(draft);save();draft=null;checked=false;override=false;view='agenda';render()})}
function renderConflicts(){const cs=conflicts();content.innerHTML=cs.length?cs.map(c=>`<article class="card" style="border-left:6px solid #ef4444"><div class="eyebrow" style="color:#b91c1c">${c.p==='eric'?'Eric':'Ryan'} conflict</div><h2>${new Date(c.a.date+'T12:00:00').toLocaleDateString()}</h2><strong>${c.a.title}</strong> overlaps <strong>${c.b.title}</strong></article>`).join(''):'<section class="card"><h2>All clear</h2><p>No future conflicts.</p></section>'}
$('#switchUser').onclick=()=>{actor=actor==='eric'?'ryan':'eric';localStorage.setItem('together-prototype-user',actor);draft=null;render()};$('#addBtn').onclick=()=>{view='add';draft=newDraft();checked=false;override=false;render()};document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});render();
</script>
</body>
</html>
